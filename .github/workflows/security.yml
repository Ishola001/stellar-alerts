name: Dependency Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily, so newly-disclosed CVEs against already-installed dependencies
    # are caught between releases, not just when package-lock.json changes.
    - cron: '0 6 * * *'

jobs:
  osv-scan:
    name: OSV Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install OSV Scanner
        uses: google/osv-scanner-action/install@v2.0.3

      - name: Run OSV security audit
        run: osv-scanner scan source -r . --config osv-scanner.toml --format json > security-audit-report.json

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.json
          if-no-files-found: ignore
